name: DEMOS30 Android 17 full APK build
on:
  push:
    branches: [demos30-apk-build-20261105]
    paths:
      - 'demos-android/**'
      - '.github/workflows/demos30-apk.yml'
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'
      - name: Android 17 build toolchain
        run: |
          set -euxo pipefail
          sdkmanager --install "platforms;android-37" "build-tools;36.0.0" "ndk;28.2.13676358"
      - name: Download pinned genuine SIMH-DVK implementation
        run: |
          set -euxo pipefail
          git clone --filter=blob:none --single-branch --branch simh-dvk https://github.com/shattered/simh.git simh-dvk
          git -C simh-dvk checkout 6d424e6a2990172eeef283972b592d027b5ec1bc
      - name: Install pinned DEMOS harddisk from historical public archive
        run: |
          set -euxo pipefail
          curl -fLsS --retry 3 -o /tmp/dvk-demos.zip https://storage.googleapis.com/google-code-archive-downloads/v2/code.google.com/vak-opensource/dvk-demos.zip
          echo 'bc68822c7a3ae187163edfa665dbc6c8b3f361d9dd7471eebcd6cd16a58fb445  /tmp/dvk-demos.zip' | sha256sum -c -
          mkdir -p demos-android/app/src/main/assets
          unzip -p /tmp/dvk-demos.zip dvk-demos/harddisk.img > demos-android/app/src/main/assets/harddisk.img
          test "$(stat -c '%s' demos-android/app/src/main/assets/harddisk.img)" -eq 20003840
          sha256sum demos-android/app/src/main/assets/harddisk.img
      - name: Crosscompile DVK executable and JNI PTY for arm64 and x86_64
        run: |
          set -euxo pipefail
          bash demos-android/tools/build-native.sh > native-build.log 2>&1 || { tail -160 native-build.log; exit 1; }
          tail -45 native-build.log
      - name: Assemble actual Android 17 APK
        run: |
          set -euxo pipefail
          cd demos-android
          gradle --no-daemon :app:assembleDebug --stacktrace > ../android-build.log 2>&1 || { tail -220 ../android-build.log; exit 1; }
          tail -45 ../android-build.log
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          unzip -l "$APK" | grep -E 'libpdp11|libptybridge|harddisk.img|classes.dex'
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK" | head -10
          sha256sum "$APK"
      - name: Upload APK and reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: DEMOS30-android17-apk
          path: |
            demos-android/app/build/outputs/apk/debug/app-debug.apk
            native-build.log
            android-build.log
          if-no-files-found: ignore
          retention-days: 30
