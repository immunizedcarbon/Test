name: TOHPE Walsh scratch validation

on:
  pull_request:
    branches:
      - feature/youtube-gemini-transcriber

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: scratch/tohpe-walsh-ci
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt
      - run: cargo fmt -- --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --release
      - run: cargo run --release | tee benchmark.txt
      - uses: actions/checkout@v4
        with:
          repository: VivienVandaele/quantum-circuit-optimization
          path: scratch/tohpe-walsh-ci/target
          persist-credentials: false
      - run: cd target && python ../patch_target.py
      - run: cd target && git diff --check
      - run: cd target && cargo check --release
      - run: cd target && git diff > ../target.patch
      - run: cd target && python ../append_target_tests.py
      - run: cd target && cargo test --release tohpe_walsh -- --nocapture | tee ../target-test.txt
      - uses: actions/upload-artifact@v4
        with:
          name: validation-output
          path: |
            scratch/tohpe-walsh-ci/benchmark.txt
            scratch/tohpe-walsh-ci/target-test.txt
            scratch/tohpe-walsh-ci/target.patch
