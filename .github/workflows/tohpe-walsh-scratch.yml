name: TOHPE Walsh scratch validation

on:
  pull_request:
    branches:
      - feature/youtube-gemini-transcriber

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: scratch/tohpe-walsh-ci
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt
      - run: cargo fmt -- --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --release
      - run: cargo run --release
      - run: git clone --depth 1 https://github.com/VivienVandaele/quantum-circuit-optimization.git target
      - run: cd target && python ../patch_target.py
      - run: cd target && git diff --check
      - run: cd target && cargo check --release
      - run: cd target && git diff > ../target.patch
      - uses: actions/upload-artifact@v4
        with:
          name: target-patch
          path: scratch/tohpe-walsh-ci/target.patch
